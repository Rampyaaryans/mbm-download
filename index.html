<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MBM - Download</title>
  <link rel="icon" type="image/png" href="mbm-logo.png">
  <link rel="apple-touch-icon" href="mbm-logo.png">
  <!-- Preload images immediately — browser starts downloading ASAP -->
  <link rel="preload" as="image" href="aku.png" fetchpriority="high">
  <link rel="preload" as="image" href="mbm-logo.png" fetchpriority="high">
  <link rel="preload" as="image" href="bg.png" fetchpriority="low">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    body{
      min-height:100vh;min-height:100dvh;
      font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
      background:#06060e;color:#fff;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      overflow-x:hidden;overflow-y:auto;
      cursor:default;
    }

    /* ── WebGL Gas Canvas ── */
    #gas{
      position:fixed;inset:0;width:100%;height:100%;
      z-index:1;
      /* smooth upscale from low-res canvas = natural gas blur */
      image-rendering:auto;
      transition:opacity 1.5s ease;
    }

    /* ── Background Image (behind gas) ── */
    .bg{position:fixed;inset:0;z-index:0;background:#06060e}
    .bg img{
      width:100%;height:100%;object-fit:cover;
      filter:brightness(0.3) saturate(1.3);
      opacity:0;transition:opacity 1.5s ease;
    }
    .bg img.loaded{opacity:1}

    /* ── Dark overlay for text readability ── */
    .overlay{
      position:fixed;inset:0;z-index:2;pointer-events:none;
      background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,0.5) 100%);
    }

    /* ── Mouse Glow Follower ── */
    .mouse-glow{
      position:fixed;z-index:3;pointer-events:none;
      width:400px;height:400px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(120,40,200,0.12) 0%,rgba(255,50,120,0.06) 30%,transparent 70%);
      transform:translate(-50%,-50%);
      transition:left 0.15s ease-out,top 0.15s ease-out,opacity 0.4s;
      opacity:0;
      mix-blend-mode:screen;
    }
    .mouse-glow.active{opacity:1}

    /* ── Content ── */
    .content{
      position:relative;z-index:10;
      display:flex;flex-direction:column;align-items:center;
      padding:40px 20px;gap:16px;
      width:100%;max-width:720px;
    }

    /* ── Logo ── */
    .logo{
      width:90px;height:90px;border-radius:22px;
      box-shadow:0 0 50px rgba(255,80,150,0.4),0 0 100px rgba(120,0,255,0.2);
      animation:logo-float 4s ease-in-out infinite;
      opacity:0;transform:scale(0.5);
      transition:opacity 0.8s ease,transform 0.8s cubic-bezier(0.34,1.56,0.64,1);
    }
    .logo.show{opacity:1;transform:scale(1)}
    @keyframes logo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

    /* ── Title ── */
    .title{
      font-size:clamp(2rem,6vw,3.2rem);
      font-weight:800;letter-spacing:3px;
      background:linear-gradient(135deg,#fff 0%,#ff80b0 50%,#a060ff 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;
      text-shadow:none;
      opacity:0;transform:translateY(20px);
      transition:opacity 0.6s ease 0.2s,transform 0.6s ease 0.2s;
    }
    .title.show{opacity:1;transform:translateY(0)}

    .subtitle{
      color:rgba(255,255,255,0.4);
      font-size:clamp(0.85rem,2vw,1.05rem);
      text-align:center;letter-spacing:1px;
      opacity:0;transition:opacity 0.6s ease 0.4s;
    }
    .subtitle.show{opacity:1}

    /* ── Download Circles ── */
    .circles{
      display:flex;gap:clamp(30px,10vw,90px);
      align-items:center;justify-content:center;
      flex-wrap:wrap;margin:24px 0 10px;
    }

    .aku-circle{
      display:flex;flex-direction:column;align-items:center;gap:14px;
      cursor:pointer;text-decoration:none;color:#fff;
      /* HIDDEN initially — revealed after 2s */
      opacity:0;transform:scale(0.3) translateY(40px);
      filter:blur(12px);
      transition:opacity 0.8s cubic-bezier(0.22,1,0.36,1),
                 transform 0.8s cubic-bezier(0.34,1.56,0.64,1),
                 filter 0.8s ease;
    }
    .aku-circle.show{
      opacity:1;transform:scale(1) translateY(0);filter:blur(0);
    }
    .aku-circle:nth-child(3){transition-delay:0.15s}

    .aku-circle:hover{transform:scale(1.06) translateY(-4px)!important}
    .aku-circle:active{transform:scale(0.95)!important;transition-duration:0.15s!important}

    .circle-wrap{
      position:relative;
      width:clamp(130px,30vw,185px);height:clamp(130px,30vw,185px);
    }

    /* ── Animated Ring ── */
    .circle-ring{
      position:absolute;inset:-4px;border-radius:50%;
      border:2px solid transparent;
      animation:ring-spin 6s linear infinite;
    }
    .circle-ring.pink{
      border-top-color:rgba(255,100,180,0.7);
      border-right-color:rgba(255,100,180,0.2);
      box-shadow:0 0 20px rgba(255,80,150,0.15);
    }
    .circle-ring.green{
      border-top-color:rgba(100,255,180,0.7);
      border-right-color:rgba(100,255,180,0.2);
      box-shadow:0 0 20px rgba(100,255,180,0.15);
      animation-direction:reverse;
    }
    @keyframes ring-spin{to{transform:rotate(360deg)}}

    /* ── Glow behind circle ── */
    .circle-glow{
      position:absolute;inset:-18px;border-radius:50%;
      animation:glow-breathe 3s ease-in-out infinite;
    }
    .circle-glow.pink{
      background:radial-gradient(circle,rgba(255,80,180,0.3) 0%,rgba(255,60,140,0.08) 50%,transparent 70%);
      box-shadow:0 0 40px rgba(255,80,150,0.25);
    }
    .circle-glow.green{
      background:radial-gradient(circle,rgba(80,255,180,0.3) 0%,rgba(40,220,120,0.08) 50%,transparent 70%);
      box-shadow:0 0 40px rgba(100,255,180,0.25);
      animation-delay:0.6s;
    }
    @keyframes glow-breathe{
      0%,100%{transform:scale(1);opacity:0.6}
      50%{transform:scale(1.15);opacity:1}
    }

    .circle-img{
      width:100%;height:100%;border-radius:50%;
      object-fit:cover;position:relative;z-index:1;
      /* glass-like border */
      border:3px solid rgba(255,255,255,0.15);
      box-shadow:inset 0 0 30px rgba(0,0,0,0.3);
      transition:border-color 0.3s,box-shadow 0.3s;
    }
    .aku-circle:hover .circle-img.pink-border{
      border-color:rgba(255,150,200,0.8);
      box-shadow:0 0 30px rgba(255,80,150,0.4),inset 0 0 30px rgba(0,0,0,0.3);
    }
    .aku-circle:hover .circle-img.green-border{
      border-color:rgba(100,255,180,0.8);
      box-shadow:0 0 30px rgba(100,255,180,0.4),inset 0 0 30px rgba(0,0,0,0.3);
    }
    .circle-img.pink-border{border-color:rgba(255,150,200,0.45)}
    .circle-img.green-border{border-color:rgba(100,255,180,0.45)}

    .circle-label{
      font-size:clamp(1.05rem,2.8vw,1.35rem);font-weight:700;
      letter-spacing:1px;
      text-shadow:0 0 30px rgba(255,255,255,0.15);
    }
    .circle-sub{
      font-size:clamp(0.72rem,1.8vw,0.85rem);
      color:rgba(255,255,255,0.4);margin-top:-8px;
    }
    .circle-size{
      font-size:clamp(0.65rem,1.5vw,0.75rem);
      color:rgba(255,255,255,0.25);margin-top:-6px;
    }

    /* ── Divider ── */
    .divider{display:none}
    @media(min-width:540px){
      .divider{
        display:block;width:1px;height:210px;align-self:center;
        background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.1),transparent);
        opacity:0;transition:opacity 0.8s ease 0.3s;
      }
      .divider.show{opacity:1}
    }

    /* ── Footer ── */
    .footer{
      color:rgba(255,255,255,0.2);font-size:0.75rem;text-align:center;
      margin-top:8px;
      opacity:0;transition:opacity 0.6s ease 0.6s;
    }
    .footer.show{opacity:1}
    .footer a{color:rgba(255,255,255,0.3);text-decoration:none}
    .footer a:hover{color:rgba(255,255,255,0.6)}

    /* ── Confetti ── */
    .confetti{
      position:fixed;z-index:250;pointer-events:none;
      animation:confetti-fall linear forwards;
    }
    @keyframes confetti-fall{
      0%{transform:translateY(-20px) rotate(0deg) scale(1);opacity:1}
      80%{opacity:1}
      100%{transform:translateY(110vh) rotate(1080deg) scale(0.3);opacity:0}
    }

    /* ── Responsive ── */
    @media(max-width:700px){
      .circles{gap:28px}
      .circle-wrap{width:clamp(100px,28vw,140px);height:clamp(100px,28vw,140px)}
    }
    @media(max-width:520px){
      .circles{gap:22px}
      .circle-wrap{width:clamp(90px,26vw,120px);height:clamp(90px,26vw,120px)}
    }

    /* ── Reduce motion for accessibility ── */
    @media(prefers-reduced-motion:reduce){
      *{animation-duration:0.01ms!important;transition-duration:0.01ms!important}
      .aku-circle,.logo,.title,.subtitle,.footer,.divider{
        opacity:1!important;transform:none!important;filter:none!important;
      }
    }
  </style>
</head>
<body>

  <!-- WebGL Gas Canvas — renders instantly (pure GPU math, no images) -->
  <canvas id="gas" aria-hidden="true"></canvas>

  <!-- Background image — loads behind the gas -->
  <div class="bg">
    <img src="bg.png" alt="" loading="eager" decoding="async"
         onload="this.classList.add('loaded')">
  </div>
  <div class="overlay"></div>

  <!-- Mouse glow follower -->
  <div class="mouse-glow" id="mouseGlow"></div>

  <div class="content">
    <img class="logo" id="logo" src="mbm-logo.png" alt="MBM" draggable="false"
         decoding="async" fetchpriority="high">
    <h1 class="title" id="title">MBM App</h1>
    <p class="subtitle" id="subtitle">Download for your device</p>

    <div class="circles">
      <!-- Android APK -->
      <a class="aku-circle" id="circle1"
         href="https://github.com/Rampyaaryans/mbm-download/releases/download/v1.0.0/app-release.apk"
         onclick="celebrate()">
        <div class="circle-wrap">
          <div class="circle-glow pink"></div>
          <div class="circle-ring pink"></div>
          <img class="circle-img pink-border" src="aku.png" alt="Download Android"
               draggable="false" decoding="async" fetchpriority="high">
        </div>
        <div class="circle-label">Android</div>
        <div class="circle-sub">Works on all phones</div>
        <div class="circle-size">90.2 MB</div>
      </a>

      <div class="divider" id="divider"></div>

      <!-- Web Version -->
      <a class="aku-circle" id="circle2"
         href="https://mbmapp.pages.dev" target="_blank" rel="noopener"
         onclick="celebrate()">
        <div class="circle-wrap">
          <div class="circle-glow green"></div>
          <div class="circle-ring green"></div>
          <img class="circle-img green-border" src="aku.png" alt="Open web version"
               draggable="false" decoding="async" fetchpriority="high">
        </div>
        <div class="circle-label">Web Version</div>
        <div class="circle-sub">No install needed</div>
        <div class="circle-size">mbmapp.pages.dev</div>
      </a>
    </div>

    <p class="footer" id="footer">
      MBM University, Jodhpur &nbsp;·&nbsp; <a href="privacy.html">Privacy Policy</a>
    </p>
  </div>

  <script>
  /* ═══════════════════════════════════════════════════════════════════════════
     WebGL Nebula Gas Shader — Grok-style interactive gas effect
     GPU-accelerated, runs at 60fps, reacts to mouse/touch
     ═══════════════════════════════════════════════════════════════════════════ */
  (function(){
    const canvas = document.getElementById('gas');
    const gl = canvas.getContext('webgl',{alpha:false,antialias:false,depth:false,stencil:false,preserveDrawingBuffer:false});
    if(!gl){canvas.style.background='#06060e';revealContent();return}

    // ── Resolution: render at low-res for performance + natural gas blur ──
    const isMobile = window.innerWidth < 600;
    const SCALE = isMobile ? 0.3 : 0.45;

    function resize(){
      canvas.width = Math.floor(window.innerWidth * SCALE);
      canvas.height = Math.floor(window.innerHeight * SCALE);
      gl.viewport(0,0,canvas.width,canvas.height);
    }
    resize();
    window.addEventListener('resize',resize);

    // ── Vertex Shader (simple fullscreen quad) ──
    const VS = `
      attribute vec2 a_pos;
      void main(){gl_Position=vec4(a_pos,0,1);}
    `;

    // ── Fragment Shader (the magic) ──
    const FS = `
      precision highp float;
      uniform float u_t;
      uniform vec2 u_res;
      uniform vec2 u_mouse;
      uniform float u_mActive;

      float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

      float noise(vec2 p){
        vec2 i=floor(p),f=fract(p);
        f=f*f*(3.0-2.0*f);
        return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),
                   mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
      }

      float fbm(vec2 p){
        float f=0.0,w=0.5;
        for(int i=0;i<5;i++){f+=w*noise(p);p*=2.03;w*=0.49;}
        return f;
      }

      void main(){
        vec2 uv=gl_FragCoord.xy/u_res;
        float asp=u_res.x/u_res.y;
        vec2 p=(uv-0.5)*vec2(asp,1.0);

        float t=u_t*0.04;

        // Mouse warp
        vec2 mp=(u_mouse-0.5)*vec2(asp,1.0);
        float md=length(p-mp);
        vec2 mf=(p-mp)*exp(-md*3.5)*u_mActive*0.45;

        // Domain warp layers
        vec2 q=vec2(
          fbm(p*2.5+t+mf),
          fbm(p*2.5+vec2(5.2,1.3)+t*0.7)
        );
        vec2 r=vec2(
          fbm(p*2.5+q*3.5+vec2(1.7,9.2)+t*0.25),
          fbm(p*2.5+q*3.5+vec2(8.3,2.8)+t*0.35)
        );
        float f=fbm(p*2.5+r*3.0);

        // Color palette: deep space → blue → purple → pink
        vec3 c=vec3(0.015,0.015,0.04);
        c=mix(c,vec3(0.04,0.12,0.38),clamp(f*1.6,0.0,1.0));
        c=mix(c,vec3(0.45,0.04,0.62),clamp(q.x*0.75,0.0,1.0));
        c=mix(c,vec3(0.95,0.12,0.38),clamp(r.y*0.55,0.0,1.0));
        c+=vec3(0.0,0.55,0.45)*smoothstep(0.42,0.85,r.x)*0.12;

        // Brightness
        c*=f*f*2.8+0.025;

        // Mouse glow
        float mg=exp(-md*5.5)*u_mActive;
        c+=vec3(0.25,0.08,0.45)*mg*0.55;
        c+=vec3(0.5,0.15,0.3)*mg*mg*0.4;

        // Vignette
        float vig=1.0-length(uv-0.5)*1.15;
        c*=smoothstep(0.0,0.55,vig);

        // Subtle pulse
        c*=0.92+0.08*sin(u_t*0.25);

        gl_FragColor=vec4(clamp(c,0.0,1.0),1.0);
      }
    `;

    // ── Compile shaders ──
    function createShader(src,type){
      const s=gl.createShader(type);
      gl.shaderSource(s,src);gl.compileShader(s);
      if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
        console.warn('Shader error:',gl.getShaderInfoLog(s));return null;
      }
      return s;
    }
    const vs=createShader(VS,gl.VERTEX_SHADER);
    const fs=createShader(FS,gl.FRAGMENT_SHADER);
    if(!vs||!fs){canvas.style.background='#06060e';revealContent();return}

    const prog=gl.createProgram();
    gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){
      console.warn('Link error');canvas.style.background='#06060e';revealContent();return;
    }
    gl.useProgram(prog);

    // ── Fullscreen quad geometry ──
    const buf=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const aPos=gl.getAttribLocation(prog,'a_pos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);

    // ── Uniforms ──
    const uT=gl.getUniformLocation(prog,'u_t');
    const uRes=gl.getUniformLocation(prog,'u_res');
    const uMouse=gl.getUniformLocation(prog,'u_mouse');
    const uMActive=gl.getUniformLocation(prog,'u_mActive');

    // ── Mouse tracking with smooth lerp ──
    let mx=0.5,my=0.5,tx=0.5,ty=0.5,mActive=0,tmActive=0;

    document.addEventListener('mousemove',function(e){
      tx=e.clientX/window.innerWidth;
      ty=1.0-e.clientY/window.innerHeight;
      tmActive=1;
      // Move the CSS glow follower
      const glow=document.getElementById('mouseGlow');
      glow.style.left=e.clientX+'px';
      glow.style.top=e.clientY+'px';
      glow.classList.add('active');
    });
    document.addEventListener('mouseleave',function(){
      tmActive=0;
      document.getElementById('mouseGlow').classList.remove('active');
    });
    // Touch support
    document.addEventListener('touchmove',function(e){
      const t=e.touches[0];
      tx=t.clientX/window.innerWidth;
      ty=1.0-t.clientY/window.innerHeight;
      tmActive=1;
      const glow=document.getElementById('mouseGlow');
      glow.style.left=t.clientX+'px';
      glow.style.top=t.clientY+'px';
      glow.classList.add('active');
    },{passive:true});
    document.addEventListener('touchend',function(){
      tmActive=0;
      document.getElementById('mouseGlow').classList.remove('active');
    });

    // ── Render loop ──
    const startTime=performance.now();
    function render(){
      const t=(performance.now()-startTime)*0.001;

      // Smooth lerp mouse position (inertia)
      mx+=(tx-mx)*0.06;
      my+=(ty-my)*0.06;
      mActive+=(tmActive-mActive)*0.04;

      gl.uniform1f(uT,t);
      gl.uniform2f(uRes,canvas.width,canvas.height);
      gl.uniform2f(uMouse,mx,my);
      gl.uniform1f(uMActive,mActive);

      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
      requestAnimationFrame(render);
    }
    render();
  })();

  /* ═══════════════════════════════════════════════════════════════════════════
     Content Reveal — staged animation
     ═══════════════════════════════════════════════════════════════════════════ */
  function revealContent(){
    // Stage 1: Logo + title (0.3s)
    setTimeout(function(){
      document.getElementById('logo').classList.add('show');
      document.getElementById('title').classList.add('show');
      document.getElementById('subtitle').classList.add('show');
    },300);

    // Stage 2: Circles appear after 2s (after gas intro plays)
    setTimeout(function(){
      document.getElementById('circle1').classList.add('show');
      document.getElementById('circle2').classList.add('show');
      var d=document.getElementById('divider');if(d)d.classList.add('show');
      document.getElementById('footer').classList.add('show');

      // Dim gas slightly so circles pop
      var gas=document.getElementById('gas');
      if(gas)gas.style.opacity='0.55';
    },2000);
  }

  // Start reveal sequence
  revealContent();

  // ── Preload images eagerly (backup in case rel=preload misses) ──
  ['aku.png','mbm-logo.png','bg.png'].forEach(function(u){
    var img=new Image();img.src=u;
  });

  /* ═══════════════════════════════════════════════════════════════════════════
     Confetti Celebration
     ═══════════════════════════════════════════════════════════════════════════ */
  function celebrate(){
    var colors=['#ff4081','#ff6e40','#ffd740','#64ffda','#448aff','#e040fb','#76ff03','#ff1744'];
    var count=window.innerWidth<600?60:120;
    for(var i=0;i<count;i++){
      (function(i){
        setTimeout(function(){
          var el=document.createElement('div');
          el.className='confetti';
          el.style.left=Math.random()*100+'vw';
          el.style.top='-20px';
          var size=6+Math.random()*10;
          el.style.width=size+'px';
          el.style.height=size+'px';
          el.style.background=colors[Math.floor(Math.random()*colors.length)];
          el.style.borderRadius=Math.random()>0.5?'50%':'2px';
          el.style.animationDuration=(2+Math.random()*3)+'s';
          document.body.appendChild(el);
          setTimeout(function(){el.remove()},5500);
        },Math.random()*1500);
      })(i);
    }
  }
  </script>
</body>
</html>
